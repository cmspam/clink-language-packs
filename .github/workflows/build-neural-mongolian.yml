name: Build the Mongolian neural model

# The neural model is trained here rather than on a machine of the author's,
# so the pack can be rebuilt from its pinned sources.
#
# Training runs on Linux because that is where PyTorch is fastest. The Core ML
# conversion cannot: coremltools ships the native blob writer that writes a
# package only for macOS, so on Linux the conversion ends with "BlobWriter not
# loaded". The two halves are therefore two jobs, with the checkpoint passing
# between them.
#
# The output is uploaded as an artifact. Copy it into Lexicons/ and push, and
# the release workflow publishes it with the rest of the pack.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/prepare-mongolian.py'
      - 'tools/train-neural.py'
      - 'requirements-train.txt'
      - '.github/workflows/build-neural-mongolian.yml'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the training environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
      - name: Fetch the Mongolian corpus
        run: python3 tools/prepare-mongolian.py source/.cache 300000
      - name: Train
        # The conversion that follows the training cannot run on Linux, and
        # the trainer does both in one command. The checkpoint is written
        # before the conversion starts, so it is what the macOS job needs.
        #
        # The step count is what the job limit allows: the runner does about
        # 0.28 seconds a step, a sentence of the corpus is about twenty pairs,
        # and a job may run six hours. Two hundred thousand lines of the web
        # corpus fit in that with room to spare.
        run: |
          python3 tools/train-neural.py --lang mn --bpe 12000 --epochs 2 --max-lines 200000 || true
          test -f tools/.lm_mn.pt
      - uses: actions/upload-artifact@v4
        with:
          name: mn-checkpoint
          path: tools/.lm_mn.pt
          # The checkpoint is a dotfile, and upload-artifact leaves dotfiles
          # out unless it is told not to.
          include-hidden-files: true
          retention-days: 7

  compile:
    needs: train
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the training environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
      - name: Fetch the Mongolian corpus
        # The export rebuilds the vocabulary from the corpus, so it has to
        # match the one the checkpoint was trained against.
        run: python3 tools/prepare-mongolian.py source/.cache 300000
      - uses: actions/download-artifact@v4
        with:
          name: mn-checkpoint
          path: tools
      - name: Export the Core ML model
        run: python3 tools/train-neural.py --lang mn --bpe 12000 --max-lines 200000 --export-only
      - name: Compile the Core ML model
        run: |
          xcrun --find coremlcompiler
          xcrun coremlcompiler compile tools/.lm_build/mn.mlpackage Lexicons
          ls -la Lexicons/mn.mlmodelc
      - uses: actions/upload-artifact@v4
        with:
          name: mn-neural
          path: |
            Lexicons/mn.mlmodelc
            Lexicons/mn.bpevocab
          retention-days: 30
