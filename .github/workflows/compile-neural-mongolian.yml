name: Compile the Mongolian neural model

# The Core ML conversion needs macOS: coremltools ships the native blob writer
# that writes the package only for macOS, so on Linux the conversion ends with
# "BlobWriter not loaded" and on a macOS runner with the wrong Python version
# it ends with the same thing, because pip then builds coremltools from source
# and a source build has no native modules either. coremltools 8.0 has wheels
# up to Python 3.11 only, so this job runs on 3.11.
#
# It is a workflow of its own rather than a second job in the training
# workflow, so the macOS runner can be asked for without waiting on the
# training, and so the checkpoint can come from any training run.

on:
  workflow_run:
    workflows: ["Build the Mongolian neural model"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: The training run to take the checkpoint from
        required: true

permissions:
  actions: read
  contents: read

jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the training environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
      - name: Fetch the Mongolian corpus
        # The export rebuilds the vocabulary from the corpus, so it has to
        # match the one the checkpoint was trained against.
        run: python3 tools/prepare-mongolian.py source/.cache 300000
      - uses: actions/download-artifact@v4
        with:
          name: mn-checkpoint
          path: tools
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export the Core ML model
        run: python3 tools/train-neural.py --lang mn --bpe 12000 --max-lines 200000 --export-only
      - name: Compile the Core ML model
        run: |
          xcrun --find coremlcompiler
          xcrun coremlcompiler compile tools/.lm_build/mn.mlpackage Lexicons
          ls -la Lexicons/mn.mlmodelc
      - uses: actions/upload-artifact@v4
        with:
          name: mn-neural
          path: |
            Lexicons/mn.mlmodelc
            Lexicons/mn.bpevocab
          retention-days: 30
